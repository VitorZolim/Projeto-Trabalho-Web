<!-- [R7] Qualidade e organização do código -->
<html lang="pt-BR"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Ferramentas de Tecnologia</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <script src="../JS/app.js" defer=""></script>
</head>
<body>

  <header class="cabecalho">
    <h1>Catálogo de Ferramentas de Tecnologia</h1>
    <p>Pesquise, filtre e cadastre as ferramentas que você usa no dia a dia.</p>
  </header>

  <main class="principal">

    <!-- [R3] Busca e filtro -->
    <section class="bloco" aria-labelledby="titulo-busca">
      <h2 id="titulo-busca">Buscar e filtrar</h2>
      <div class="linha-filtros">
        <div class="campo">
          <label for="busca">Buscar por nome</label>
          <input type="text" id="busca" placeholder="Digite para buscar... (Esc limpa)">
        </div>
        <div class="campo">
          <label for="filtro-categoria">Categoria</label>
          <select id="filtro-categoria">
            <option value="Todas">Todas</option>
            <option value="Linguagem">Linguagem</option>
            <option value="IDE">Ambiente de Desenvolvimento</option>
            <option value="Framework">Frameworks</option>
            <option value="IA">Inteligência Artificial</option>
          </select>
        </div>
      </div>
    </section>

    <!-- [R6] Painel de estatísticas -->
    <section class="bloco" aria-labelledby="titulo-painel">
      <h2 id="titulo-painel">Painel</h2>
      <div class="painel" id="painel">
        <div class="estatistica">
          <span class="estatistica-rotulo">Itens exibidos</span>
          <strong id="stat-total">—</strong>
        </div>
        <div class="estatistica">
          <span class="estatistica-rotulo">Favoritos</span>
          <strong id="stat-favoritos">—</strong>
        </div>
        <div class="estatistica">
          <span class="estatistica-rotulo">Ano</span>
          <strong id="stat-media">—</strong>
        </div>
        <div class="estatistica">
          <span class="estatistica-rotulo">Mais novo</span>
          <strong id="stat-maior">—</strong>
        </div>
      </div>
    </section>

    <!-- [R2] Renderização dinâmica -->
    <section class="bloco" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Ferramentas</h2>
      <div class="lista" id="lista"></div>
    </section>

    <!-- [R4] Cadastro de novas ferramentas com validação -->
    <section class="bloco" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Cadastrar nova ferramenta</h2>

      <form id="form-cadastro" novalidate="">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex.: Visual Studio Code">
        </div>

        <div class="campo">
          <label for="preco">Ano</label>
          <input type="text" id="ano" name="ano" placeholder="Ex.: 1999">
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria">
            <option value="">Selecione...</option>
            <option value="Linguagem">Linguagem</option>
            <option value="IDE">Ambiente de Desenvolvimento</option>
            <option value="Framework">Frameworks</option>
            <option value="IA">Inteligência Artificial</option>
          </select>
        </div>

        <div class="campo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" rows="3" placeholder="Para que serve a ferramenta?"></textarea>
        </div>

        <div id="mensagem" class="mensagem" role="alert" aria-live="polite"></div>

        <button type="submit" class="botao">Cadastrar</button>
      </form>
    </section>

  </main>

  <footer class="rodape">
    <p>Projeto de JavaScript - Catálogo Interativo - Dupla: Vitor &amp; Victor</p>
    <!-- Desafio Extra - modo escuro -->
    <button type="button" class="botao botao-secundario" id="btn-tema">Alternar modo escuro</button>
  </footer>


</body>
</html>
